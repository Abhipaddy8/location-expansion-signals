# Source + company config (config-anchored entity resolution).
# Each company carries its canonical identity (so news matches a known entity), its ATS
# board, and the candidate new metro(s) to detect. Verified live 2026-06-17.

sources:
  greenhouse:
    enabled: true
  news:
    enabled: true
  press:
    enabled: true
  econdev:
    enabled: true

companies:
  - name: Intercom
    slug: intercom
    domain: intercom.com
    industry: customer service / ai saas
    country: US
    hq: {city: San Francisco, region: CA, country: US}
    greenhouse: intercom
    watch_metros: ["Berlin, Germany"]

