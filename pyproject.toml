[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signal-connector"
version = "0.1.0"
description = "Signalbase location-expansion connector — scrapes public sources, corroborates, idempotently grows a signal database"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "selectolax>=0.3.21",
    "feedparser>=6.0",
    "structlog>=24.1",
    "apscheduler>=3.10",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
signal-connector = "signal_connector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_connector"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
